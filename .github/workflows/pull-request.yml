name: Continuous Integration

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-dependabot:
    name: Check Dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate dependabot.yml
        uses: marocchino/validate-dependabot@v3
        with:
          path: .github/dependabot.yml

  check-infrastructure:
    name: Check Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infrastructure
      - name: Validate AWS OpenTofu configuration
        run: |
          tofu -chdir=infrastructure/aws init -backend=false
          tofu -chdir=infrastructure/aws validate
      - name: Validate STACKIT OpenTofu configuration
        run: |
          tofu -chdir=infrastructure/stackit init -backend=false
          tofu -chdir=infrastructure/stackit validate

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pull-request
      - name: Check formatting
        id: format
        run: cargo fmt -- --check
        continue-on-error: true
      - name: Run clippy
        id: clippy
        run: cargo clippy
        continue-on-error: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run unit tests
        id: tests
        run: cargo nextest run
        continue-on-error: true
      - name: Run release check
        id: check
        run: cargo check --profile release-check
        continue-on-error: true
      - name: Aggregate results and fail if any failed
        if: always() # ensure this runs even if earlier steps failed
        run: |
          echo "format outcome:   ${{ steps.format.outcome }}"
          echo "clippy outcome:  ${{ steps.clippy.outcome }}"
          echo "tests outcome:  ${{ steps.tests.outcome }}"
          echo "check outcome:  ${{ steps.check.outcome }}"

          # If any step outcome is 'failure' then fail the job
          for s in "${{ steps.format.outcome }}" "${{ steps.clippy.outcome }}" "${{ steps.tests.outcome }}" "${{ steps.check.outcome }}"; do
            if [ "$s" = "failure" ]; then
              echo "One or more checks failed."
              exit 1
            fi
          done

          echo "All checks passed."
