[package]
name = "diwop-begleitapp"
version = "0.1.0"
edition = "2021"

[profile.release-check]
inherits = "release"
opt-level = 0

[dependencies]
axum = "0.8"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.7", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
serde_json = "1.0"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33" }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics", "trace"] }
tracing-opentelemetry = "0.34"
utoipa = "5"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1.0"
