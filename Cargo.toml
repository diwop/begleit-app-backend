[package]
name = "diwop-begleitapp"
version = "0.1.0"
edition = "2021"

[profile.release-check]
inherits = "release"
opt-level = 0

[dependencies]
axum = "0.8"
tokio = { version = "1.52.3", features = ["full"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.7", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
serde_json = "1.0"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33" }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics", "trace"] }
tracing-opentelemetry = "0.34"
utoipa = "6"
rig = { package = "rig-core", version = "0.42.0" }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
flate2 = "1.0"
askama = "0.16"
sha2 = "0.10"
subtle = "2.5"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "form"] }
serde_json = "1.0"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
